[workspace]
members = [".", "crates/engine-core", "crates/drag-sensor"]
resolver = "2"

[package]
name = "uruk-convert"
version = "1.0.1"
description = "Uruk Convert — clean-room, open-source offline file converter (desktop shell)"
authors = ["URUK contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "uruk_convert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uruk-engine-core = { path = "crates/engine-core" }
uruk-drag-sensor = { path = "crates/drag-sensor" }
