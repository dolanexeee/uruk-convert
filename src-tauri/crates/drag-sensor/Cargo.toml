[package]
name = "uruk-drag-sensor"
version = "1.0.0"
description = "Uruk Convert — global drag sensing + native wheel overlay (per-platform modules behind one DragSensor trait)"
authors = ["URUK contributors"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
tiny-skia = "0.11"
ttf-parser = "0.20"
libc = "0.2"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes", "xinput"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
