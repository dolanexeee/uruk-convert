[package]
name = "uruk-engine-core"
version = "0.2.0"
description = "Uruk Convert — conversion engine layer (FFmpeg / ImageMagick / 7-Zip / Pandoc sidecars; LibreOffice + poppler resolved)"
authors = ["URUK contributors"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "engine-cli"
path = "src/bin/engine_cli.rs"
